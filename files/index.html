<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay-As-You-Recover Medical EMI Calculator</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        #root {
            width: 100%;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Lucide React icons as inline SVG components
        const Heart = ({ size = 24, color = "currentColor", fill = "none", ...props }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color} strokeWidth="2" {...props}>
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
        );

        const DollarSign = ({ size = 24, color = "currentColor" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2">
                <line x1="12" y1="1" x2="12" y2="23"/>
                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
        );

        const TrendingUp = ({ size = 24, color = "currentColor" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
                <polyline points="17 6 23 6 23 12"/>
            </svg>
        );

        const Shield = ({ size = 24, color = "currentColor" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
        );

        const Calendar = ({ size = 24, color = "currentColor" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
        );

        const Info = ({ size = 24, color = "currentColor" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="16" x2="12" y2="12"/>
                <line x1="12" y1="8" x2="12.01" y2="8"/>
            </svg>
        );

        const CheckCircle = ({ size = 24, color = "currentColor" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
        );

        const MedicalEMICalculator = () => {
            const [formData, setFormData] = useState({
                surgeryCost: '',
                monthlyIncome: '',
                currentSavings: '',
                recoveryWeeks: '',
                downPayment: ''
            });

            const [results, setResults] = useState(null);
            const [activeTab, setActiveTab] = useState('calculator');

            const calculateEMI = () => {
                const cost = parseFloat(formData.surgeryCost) || 0;
                const income = parseFloat(formData.monthlyIncome) || 0;
                const savings = parseFloat(formData.currentSavings) || 0;
                const recovery = parseInt(formData.recoveryWeeks) || 0;
                const downPayment = parseFloat(formData.downPayment) || 0;

                if (cost <= 0 || income <= 0) {
                    alert('Please enter valid surgery cost and monthly income');
                    return;
                }

                const loanAmount = cost - downPayment;
                const gracePeriodMonths = Math.ceil(recovery / 4);
                const maxAffordableEMI = income * 0.35;
                const repaymentMonths = 24;
                const interestRate = 0.12;
                const monthlyRate = interestRate / 12;
                
                const emiAmount = (loanAmount * monthlyRate * Math.pow(1 + monthlyRate, repaymentMonths)) / 
                                (Math.pow(1 + monthlyRate, repaymentMonths) - 1);
                
                const adjustedEMI = Math.min(emiAmount, maxAffordableEMI);
                
                let finalTenure = repaymentMonths;
                if (adjustedEMI < emiAmount) {
                    finalTenure = Math.ceil(
                        Math.log(adjustedEMI / (adjustedEMI - loanAmount * monthlyRate)) / 
                        Math.log(1 + monthlyRate)
                    );
                }
                
                const totalInterest = (adjustedEMI * finalTenure) - loanAmount;
                const totalRepayment = loanAmount + totalInterest;
                const riskScore = calculateRiskScore(cost, income, recovery, savings);
                const affordabilityRatio = (adjustedEMI / income) * 100;
                
                setResults({
                    loanAmount,
                    emiAmount: adjustedEMI,
                    gracePeriodMonths,
                    repaymentMonths: finalTenure,
                    totalInterest,
                    totalRepayment,
                    maxAffordableEMI,
                    riskScore,
                    affordabilityRatio,
                    firstEMIDate: new Date(Date.now() + gracePeriodMonths * 30 * 24 * 60 * 60 * 1000)
                });
                
                setActiveTab('results');
            };

            const calculateRiskScore = (cost, income, recovery, savings) => {
                let score = 0;
                
                const costToIncomeRatio = cost / income;
                if (costToIncomeRatio > 12) score += 40;
                else if (costToIncomeRatio > 8) score += 30;
                else if (costToIncomeRatio > 4) score += 20;
                else score += 10;
                
                if (recovery > 12) score += 30;
                else if (recovery > 8) score += 20;
                else if (recovery > 4) score += 10;
                else score += 5;
                
                const savingsToLoanRatio = savings / cost;
                if (savingsToLoanRatio < 0.1) score += 30;
                else if (savingsToLoanRatio < 0.2) score += 20;
                else if (savingsToLoanRatio < 0.3) score += 10;
                else score += 5;
                
                return Math.min(score, 100);
            };

            const getRiskLevel = (score) => {
                if (score >= 70) return { level: 'High', color: 'rgb(239, 68, 68)', bg: 'rgba(239, 68, 68, 0.1)' };
                if (score >= 40) return { level: 'Medium', color: 'rgb(251, 146, 60)', bg: 'rgba(251, 146, 60, 0.1)' };
                return { level: 'Low', color: 'rgb(34, 197, 94)', bg: 'rgba(34, 197, 94, 0.1)' };
            };

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const formatCurrency = (amount) => {
                return new Intl.NumberFormat('en-IN', {
                    style: 'currency',
                    currency: 'INR',
                    maximumFractionDigits: 0
                }).format(amount);
            };

            const formatDate = (date) => {
                return new Intl.DateTimeFormat('en-IN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                }).format(date);
            };

            return (
                <div style={{
                    minHeight: '100vh',
                    background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                    padding: '20px',
                    fontFamily: '"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
                }}>
                    <style>{`
                        .container {
                            max-width: 1200px;
                            margin: 0 auto;
                        }
                        
                        .header-title {
                            font-family: 'Playfair Display', serif;
                        }
                        
                        .card {
                            background: white;
                            border-radius: 24px;
                            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                            overflow: hidden;
                            transition: all 0.3s ease;
                        }
                        
                        .input-field {
                            width: 100%;
                            padding: 14px 16px;
                            border: 2px solid #e5e7eb;
                            border-radius: 12px;
                            font-size: 16px;
                            transition: all 0.3s ease;
                            font-family: 'Inter', sans-serif;
                        }
                        
                        .input-field:focus {
                            outline: none;
                            border-color: #667eea;
                            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
                        }
                        
                        .btn-primary {
                            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                            color: white;
                            padding: 16px 32px;
                            border: none;
                            border-radius: 12px;
                            font-size: 16px;
                            font-weight: 600;
                            cursor: pointer;
                            transition: all 0.3s ease;
                            width: 100%;
                        }
                        
                        .btn-primary:hover {
                            transform: translateY(-2px);
                            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
                        }
                        
                        .btn-primary:active {
                            transform: translateY(0);
                        }
                        
                        .tab-button {
                            background: transparent;
                            border: none;
                            padding: 12px 24px;
                            font-size: 14px;
                            font-weight: 600;
                            cursor: pointer;
                            color: #6b7280;
                            border-bottom: 3px solid transparent;
                            transition: all 0.3s ease;
                        }
                        
                        .tab-button.active {
                            color: #667eea;
                            border-bottom-color: #667eea;
                        }
                        
                        .stat-card {
                            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
                            border-radius: 16px;
                            padding: 24px;
                            transition: all 0.3s ease;
                        }
                        
                        .stat-card:hover {
                            transform: translateY(-4px);
                            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
                        }
                        
                        .progress-bar {
                            background: #e5e7eb;
                            height: 8px;
                            border-radius: 999px;
                            overflow: hidden;
                        }
                        
                        .progress-fill {
                            height: 100%;
                            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
                            transition: width 0.5s ease;
                        }
                        
                        @keyframes fadeIn {
                            from {
                                opacity: 0;
                                transform: translateY(20px);
                            }
                            to {
                                opacity: 1;
                                transform: translateY(0);
                            }
                        }
                        
                        .fade-in {
                            animation: fadeIn 0.6s ease forwards;
                        }
                        
                        .info-badge {
                            display: inline-flex;
                            align-items: center;
                            gap: 6px;
                            background: rgba(102, 126, 234, 0.1);
                            color: #667eea;
                            padding: 6px 12px;
                            border-radius: 20px;
                            font-size: 13px;
                            font-weight: 500;
                        }
                    `}</style>

                    <div className="container">
                        {/* Header */}
                        <div style={{ textAlign: 'center', marginBottom: '40px' }} className="fade-in">
                            <div style={{ 
                                display: 'flex', 
                                alignItems: 'center', 
                                justifyContent: 'center', 
                                gap: '12px',
                                marginBottom: '16px'
                            }}>
                                <Heart size={40} color="white" fill="white" />
                                <h1 className="header-title" style={{ 
                                    fontSize: '48px', 
                                    color: 'white',
                                    fontWeight: '700'
                                }}>
                                    Pay-As-You-Recover
                                </h1>
                            </div>
                            <p style={{ 
                                fontSize: '18px', 
                                color: 'rgba(255, 255, 255, 0.9)',
                                maxWidth: '600px',
                                margin: '0 auto'
                            }}>
                                Medical EMI Calculator with Grace Period & Flexible Repayment
                            </p>
                        </div>

                        {/* Main Content - Calculator/Results/About tabs would go here */}
                        {/* For brevity, I'll include a simplified version */}
                        
                        <div className="card fade-in" style={{ animationDelay: '0.2s', padding: '40px' }}>
                            <h2 style={{ marginBottom: '24px', color: '#1f2937', fontWeight: '700' }}>
                                Calculate Your Repayment Plan
                            </h2>

                            <div style={{ 
                                display: 'grid', 
                                gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))',
                                gap: '24px',
                                marginBottom: '32px'
                            }}>
                                {/* Input fields */}
                                <div>
                                    <label style={{ display: 'block', marginBottom: '8px', color: '#374151', fontWeight: '600', fontSize: '14px' }}>
                                        Surgery Cost (₹)
                                    </label>
                                    <input
                                        type="number"
                                        name="surgeryCost"
                                        value={formData.surgeryCost}
                                        onChange={handleInputChange}
                                        className="input-field"
                                        placeholder="500000"
                                    />
                                </div>

                                <div>
                                    <label style={{ display: 'block', marginBottom: '8px', color: '#374151', fontWeight: '600', fontSize: '14px' }}>
                                        Monthly Income (₹)
                                    </label>
                                    <input
                                        type="number"
                                        name="monthlyIncome"
                                        value={formData.monthlyIncome}
                                        onChange={handleInputChange}
                                        className="input-field"
                                        placeholder="50000"
                                    />
                                </div>

                                <div>
                                    <label style={{ display: 'block', marginBottom: '8px', color: '#374151', fontWeight: '600', fontSize: '14px' }}>
                                        Current Savings (₹)
                                    </label>
                                    <input
                                        type="number"
                                        name="currentSavings"
                                        value={formData.currentSavings}
                                        onChange={handleInputChange}
                                        className="input-field"
                                        placeholder="100000"
                                    />
                                </div>

                                <div>
                                    <label style={{ display: 'block', marginBottom: '8px', color: '#374151', fontWeight: '600', fontSize: '14px' }}>
                                        Recovery Period (Weeks)
                                    </label>
                                    <input
                                        type="number"
                                        name="recoveryWeeks"
                                        value={formData.recoveryWeeks}
                                        onChange={handleInputChange}
                                        className="input-field"
                                        placeholder="8"
                                    />
                                </div>

                                <div>
                                    <label style={{ display: 'block', marginBottom: '8px', color: '#374151', fontWeight: '600', fontSize: '14px' }}>
                                        Down Payment (₹)
                                    </label>
                                    <input
                                        type="number"
                                        name="downPayment"
                                        value={formData.downPayment}
                                        onChange={handleInputChange}
                                        className="input-field"
                                        placeholder="50000"
                                    />
                                </div>
                            </div>

                            <button onClick={calculateEMI} className="btn-primary">
                                Calculate Repayment Plan
                            </button>

                            {/* Results Display */}
                            {results && (
                                <div style={{ marginTop: '40px', paddingTop: '40px', borderTop: '2px solid #e5e7eb' }}>
                                    <h3 style={{ fontSize: '24px', marginBottom: '24px', color: '#1f2937', fontWeight: '700' }}>
                                        Your Repayment Plan
                                    </h3>
                                    
                                    <div style={{ 
                                        display: 'grid', 
                                        gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))',
                                        gap: '20px',
                                        marginBottom: '32px'
                                    }}>
                                        <div className="stat-card">
                                            <p style={{ fontSize: '13px', color: '#6b7280', fontWeight: '500', marginBottom: '8px' }}>Monthly EMI</p>
                                            <p style={{ fontSize: '28px', fontWeight: '700', color: '#667eea' }}>
                                                {formatCurrency(results.emiAmount)}
                                            </p>
                                            <div className="info-badge" style={{ marginTop: '12px' }}>
                                                {results.affordabilityRatio.toFixed(1)}% of income
                                            </div>
                                        </div>

                                        <div className="stat-card">
                                            <p style={{ fontSize: '13px', color: '#6b7280', fontWeight: '500', marginBottom: '8px' }}>Grace Period</p>
                                            <p style={{ fontSize: '28px', fontWeight: '700', color: '#667eea' }}>
                                                {results.gracePeriodMonths} months
                                            </p>
                                            <div className="info-badge" style={{ marginTop: '12px' }}>
                                                First EMI: {formatDate(results.firstEMIDate)}
                                            </div>
                                        </div>

                                        <div className="stat-card">
                                            <p style={{ fontSize: '13px', color: '#6b7280', fontWeight: '500', marginBottom: '8px' }}>Total Repayment</p>
                                            <p style={{ fontSize: '28px', fontWeight: '700', color: '#667eea' }}>
                                                {formatCurrency(results.totalRepayment)}
                                            </p>
                                            <div className="info-badge" style={{ marginTop: '12px' }}>
                                                Tenure: {results.repaymentMonths} months
                                            </div>
                                        </div>
                                    </div>

                                    {/* Risk Assessment */}
                                    <div style={{ 
                                        background: getRiskLevel(results.riskScore).bg,
                                        border: `2px solid ${getRiskLevel(results.riskScore).color}`,
                                        borderRadius: '16px',
                                        padding: '24px'
                                    }}>
                                        <h4 style={{ fontSize: '18px', fontWeight: '600', marginBottom: '16px', color: '#1f2937' }}>
                                            Risk Assessment: {getRiskLevel(results.riskScore).level}
                                        </h4>
                                        <div className="progress-bar" style={{ marginBottom: '12px' }}>
                                            <div 
                                                className="progress-fill"
                                                style={{ 
                                                    width: `${results.riskScore}%`,
                                                    background: getRiskLevel(results.riskScore).color
                                                }}
                                            />
                                        </div>
                                        <p style={{ fontSize: '14px', color: '#4b5563' }}>
                                            Risk Score: {results.riskScore}/100
                                        </p>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Footer */}
                        <div style={{ 
                            textAlign: 'center', 
                            marginTop: '40px',
                            color: 'rgba(255, 255, 255, 0.8)',
                            fontSize: '14px'
                        }}>
                            <p>Built for Hackathon 2025 | Compassionate Healthcare Finance</p>
                        </div>
                    </div>
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MedicalEMICalculator />);
    </script>
</body>
</html>
